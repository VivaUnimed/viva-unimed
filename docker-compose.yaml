  #     POSTGRES_USER: myuser
  #     POSTGRES_PASSWORD: mysecretpassword
  #     POSTGRES_DB: mydatabase
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

volumes:
  letsencrypt-data:
  # postgres_data:
networks:
  traefik-net:
    name: traefik-net
    driver: bridge
